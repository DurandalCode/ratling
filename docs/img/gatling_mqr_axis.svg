  <text x="1005" y="560" fill="#52514e" font-size="11">● порт ротора M5   ● AirTAC R   ○ станция</text>
  <text x="1005" y="578" fill="#52514e" font-size="11">фазировка 1…6 общая у ротора и статора</text>

  <rect x="28" y="400" width="720" height="280" rx="6" fill="#f7f5f0" stroke="#c8c4ba" stroke-width="1"/>
  <text x="48" y="430" font-size="14" font-weight="bold" fill="#0b0b0b">Зафиксировать в эскизе</text>
  <text x="48" y="458" fill="#0b0b0b">1. Ось несёт пакет на двух подшипниках — MQR не вал.</text>
  <text x="48" y="482" fill="#0b0b0b">2. Ротор MQR на торце ступицы (2×M4 PCD Ø38); статор к раме (Ø20 + 4×M4).</text>
  <text x="48" y="506" fill="#0b0b0b">3. Сквозное Ø6 MQR — не под силовую ось (штифт / пусто).</text>
  <text x="48" y="530" fill="#0b0b0b">4. Статор: 6×M5 на бочке → общий коллектор с редуктора (одно давление).</text>
  <text x="48" y="554" fill="#0b0b0b">5. Ротор: 6×M5 на торце → короткие шланги к R каждого AirTAC (к оси, ~R 38).</text>
  <text x="48" y="578" fill="#0b0b0b">6. Dump местный (L-палец жмёт M3R110) — через MQR фазу выстрела не гоним.</text>
  <text x="48" y="610" fill="#52514e">Ещё не рисуем: кулачок хода затвора, бункер, подшипник пакета в раме, обвязка редуктора.</text>
  <text x="48" y="640" fill="#52514e">3D-блоки: gatling/mqr_axis_sketch.py (вал на 2 подшипниках; MQR только воздух). Когда приедет MQR — сверить 1…6.</text>
  <text x="48" y="666" fill="#8a8680" font-size="11">Черновик 2026-11-12 · docs/gatling.md · чертёж MQR: docs/img/mqr6_dims.png</text>
