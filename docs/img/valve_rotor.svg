<text x="28" y="78" fill="#0b0b0b" font-size="15">А — со стороны ротора</text>
<text x="28" y="786" fill="#52514e">Синие корпуса нажаты. Дуга: синяя — набор, оранжевая — выстрел. Пунктир — плита. На корпусе снаружи A, внутри P и R.</text>
<text x="700" y="168" fill="#0b0b0b" font-size="15">Б — нажатый клапан, к стволам слева</text>
<text x="700" y="188" fill="#52514e" font-size="12">обрыв к оси. Зазор, толкатель и толщина диска условные.</text>
