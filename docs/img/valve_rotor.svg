<text x="28" y="600" fill="#52514e">Пунктир — нынешняя плита головки R 98. Синие корпуса кулачок держит нажатыми, оранжевая точка — кнопка.</text>
<text x="28" y="620" fill="#52514e">Сход с синей дуги (оранжевый скос) — выстрел. В покое гашетка стравливает подачу: нажатый клапан не остаётся под давлением.</text>
