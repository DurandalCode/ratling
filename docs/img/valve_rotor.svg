<text x="700" y="582" fill="#52514e">плита 10 — размер нынешней. 45.8 и ход 2.4 — с чертежа заказа.</text>
<text x="700" y="602" fill="#0b0b0b">синяя площадка 2.0 мм держит кнопку. У свободного её нет —</text>
<text x="700" y="620" fill="#0b0b0b">между кнопкой и диском зазор 2 мм. Диск сидит на валу Ø8.</text>
<text x="700" y="646" fill="#0b0b0b">Покой: P закрыт, пилот в R. Нажали — P в A, камера 0.5 с.</text>
<text x="700" y="666" fill="#0b0b0b">Отпустили — выстрел. P и R смотрят внутрь кольца, A одно наружу.</text>
